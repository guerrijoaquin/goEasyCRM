// ─── LineChart SVG ───────────────────────────────────────────────────────────
function LineChart({ values = [], days = [], color = "#3b82f6" }) {
  const W = 400, H = 110, PX = 14, PY = 12;
  const max = Math.max(...values, 1);
  const pts = values.map((v, i) => ({
    x: PX + (i / Math.max(values.length - 1, 1)) * (W - PX * 2),
    y: PY + (1 - v / max) * (H - PY * 2),
  }));
  let linePath = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `C${(pts[i-1].x+p.x)/2},${pts[i-1].y} ${(pts[i-1].x+p.x)/2},${p.y} ${p.x},${p.y}`)).join(" ");
  const areaPath = linePath + ` L${pts[pts.length-1].x},${H} L${pts[0].x},${H} Z`;
  const gid = "lg" + color.replace("#","");
  const [hovered, setHovered] = useState(null);
  return (
    <div style={{ position:"relative" }}>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:H, display:"block" }}>
        <defs>
          <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.25"/>
            <stop offset="100%" stopColor={color} stopOpacity="0.02"/>
          </linearGradient>
        </defs>
        {[0.33, 0.66].map((p,i) => (
          <line key={i} x1={PX} y1={PY + p*(H-PY*2)} x2={W-PX} y2={PY + p*(H-PY*2)} stroke="#1f2937" strokeWidth="1" strokeDasharray="4 4"/>
        ))}
        <path d={areaPath} fill={`url(#${gid})`}/>
        <path d={linePath} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((p, i) => (
          <g key={i} style={{cursor:"pointer"}}
            onMouseEnter={() => setHovered(i)}
            onMouseLeave={() => setHovered(null)}>
            <circle cx={p.x} cy={p.y} r={hovered===i ? 6 : 3.5} fill={hovered===i ? "#fff" : color} stroke={color} strokeWidth="2" style={{transition:"r 0.15s"}}/>
            <circle cx={p.x} cy={p.y} r="14" fill="transparent"/>
          </g>
        ))}
        {pts.map((p, i) => (
          <text key={i} x={p.x} y={H} textAnchor="middle" fill="#4b5563" fontSize="10">{days[i]}</text>
        ))}
        {hovered !== null && (
          <g>
            <rect x={pts[hovered].x - 38} y={pts[hovered].y - 30} width="76" height="22" rx="6" fill="#1f2937" stroke={color} strokeWidth="1" strokeOpacity="0.4"/>
            <text x={pts[hovered].x} y={pts[hovered].y - 14} textAnchor="middle" fill="#e2e8f0" fontSize="11" fontWeight="600">
              {`$${Math.round(values[hovered]).toLocaleString("es-AR")}`}
            </text>
          </g>
        )}
      </svg>
    </div>
  );
}

// ─── DonutChart SVG ──────────────────────────────────────────────────────────
function DonutChart({ segments }) {
  const R = 52, CX = 64, CY = 64, SW = 15;
  const C = 2 * Math.PI * R;
  const total = segments.reduce((s, g) => s + g.value, 0) || 1;
  let used = 0;
  return (
    <svg viewBox="0 0 128 128" style={{ width:120, height:120, flexShrink:0 }}>
      <circle cx={CX} cy={CY} r={R} fill="none" stroke="#1f2937" strokeWidth={SW}/>
      {segments.map((seg, i) => {
        const pct = seg.value / total;
        const dash = Math.max(pct * C - 3, 0);
        const offset = C / 4 - used * C;
        used += pct;
        return (
          <circle key={i} cx={CX} cy={CY} r={R} fill="none"
            stroke={seg.color} strokeWidth={SW}
            strokeDasharray={`${dash} ${C}`}
            strokeDashoffset={offset}
            strokeLinecap="round"/>
        );
      })}
      <text x={CX} y={CY - 6} textAnchor="middle" fill="#e2e8f0" fontSize="13" fontWeight="700">
        {segments.length}
      </text>
      <text x={CX} y={CY + 10} textAnchor="middle" fill="#6b7280" fontSize="9">canales</text>
    </svg>
  );
}

// ─── Gastos mock storage (localStorage) ─────────────────────────────────────
const GASTOS_KEY = "mokin_gastos";
const RUBROS = ["Envíos", "Comisiones ML", "Comisiones TN", "Publicidad", "Packaging", "Sueldos", "Impuestos", "Otros"];

function loadGastos() {
  try { return JSON.parse(localStorage.getItem(GASTOS_KEY) || "[]"); } catch { return []; }
}
function saveGastos(g) {
  localStorage.setItem(GASTOS_KEY, JSON.stringify(g));
}

// ─── Funnel component ────────────────────────────────────────────────────────
function Funnel({ steps }) {
  const max = steps[0]?.valor || 1;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 6, padding: "8px 0" }}>
      {steps.map((s, i) => {
        const pct = Math.round((s.valor / max) * 100);
        const width = 40 + pct * 0.6;
        return (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 14 }}>
            <div style={{ width: 130, fontSize: 12, color: "#9ca3af", textAlign: "right" }}>{s.label}</div>
            <div style={{ flex: 1, display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{
                width: `${width}%`, height: 36, borderRadius: 6,
                background: `linear-gradient(90deg, #3b82f6, #8b5cf6)`,
                opacity: 0.3 + (pct / 100) * 0.7,
                display: "flex", alignItems: "center", paddingLeft: 12,
                transition: "width 0.8s ease"
              }}>
                <span style={{ fontSize: 13, fontWeight: 700, color: "white" }}>
                  {s.valor.toLocaleString("es-AR")}
                </span>
              </div>
              <span style={{ fontSize: 11, color: "#6b7280", whiteSpace: "nowrap" }}>{pct}%</span>
            </div>
            {i < steps.length - 1 && (
              <div style={{ position: "absolute", right: 0 }}></div>
            )}
          </div>
        );
      })}
    </div>
  );
}

  });

  });

  // ── Proveedores ───────────────────────────────────────────────────────────
  const [proveedores, setProveedores] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mokin_prov") || "[]"); } catch { return []; }
  });
  const [provForm, setProvForm] = useState({ nombre:"", contacto:"", rubro:"", saldo:"" });
  const [provExpandido, setProvExpandido] = useState(null);
  const [novedadForm, setNovedadForm] = useState({ texto:"", tipo:"info" });

  const fetchData = useCallback(async (p = periodo) => {
    try {
      const res = await fetch(`${API_URL}/api/data?periodo=${p}`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      setData(json);
      setError(null);
    } catch (e) {
      setData(prev => prev || MOCK_DATA);
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [periodo]);

  const cambiarPeriodo = (p) => {
    setPeriodo(p);
    setLoading(true);
    fetchData(p);
  };

    setRefreshing(true);

    } finally {
      setRefreshing(false);
    }
  };

                      <div style={{ fontSize:11, color:"#6b7280", marginBottom:3 }}>Saldo que le debés ($)</div>
                      <input type="number" placeholder="0" value={provForm.saldo}
                        onChange={e=>setProvForm(p=>({...p,saldo:e.target.value}))}
                        style={{ width:"100%", background:"#1f2937", border:"1px solid #374151", color:"#e2e8f0", padding:"7px 10px", borderRadius:8, fontSize:13 }}/>
                    </div>
                    <button onClick={agregarProveedor} style={{
                      background:"linear-gradient(135deg,#3b82f6,#8b5cf6)", border:"none",
                      color:"white", padding:"9px", borderRadius:10, cursor:"pointer", fontWeight:600, fontSize:13
                    }}>Agregar proveedor</button>
                  </div>
                </div>

                {/* Novedades recientes */}
                <div className="card" style={{ padding:22 }}>
                  <div className="section-title" style={{ marginBottom:14 }}>🔔 Novedades recientes</div>
                  {novedadesRecientes.length === 0 && (
                    <div style={{ color:"#4b5563", fontSize:13 }}>Sin novedades registradas todavía.</div>
                  )}
                  {novedadesRecientes.map((n,i)=>{
                    const tipoConfig = {
                      info:     { color:"#60a5fa", icon:"ℹ️" },
                      alerta:   { color:"#f59e0b", icon:"⚠️" },
                      sinstock: { color:"#ef4444", icon:"🚫" },
                      cambio:   { color:"#a78bfa", icon:"🔄" },
                    };
                    const tc = tipoConfig[n.tipo] || tipoConfig.info;
                    return (
                      <div key={i} style={{
                        padding:"10px 14px", borderRadius:10, marginBottom:8,
                        background:"#0d111788", border:`1px solid ${tc.color}22`,
                        display:"flex", gap:10, alignItems:"flex-start"
                      }}>
                        <span style={{ fontSize:16, flexShrink:0 }}>{tc.icon}</span>
                        <div>
                          <div style={{ fontSize:11, color:tc.color, fontWeight:600, marginBottom:2 }}>{n.proveedor}</div>
                          <div style={{ fontSize:13, color:"#e2e8f0" }}>{n.texto}</div>
                          <div style={{ fontSize:10, color:"#4b5563", marginTop:3 }}>{n.fecha}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              {/* Lista de proveedores */}
              {proveedores.length === 0 && (
                <div className="card" style={{ padding:40, textAlign:"center" }}>
                  <div style={{ fontSize:40, marginBottom:12 }}>🤝</div>
                  <div style={{ fontSize:15, fontWeight:600, marginBottom:6 }}>Todavía no cargaste proveedores</div>
                  <div style={{ fontSize:13, color:"#6b7280" }}>Usá el formulario de arriba para agregar tu primer proveedor.</div>
                </div>
              )}

              {proveedores.map(p=>(
                <div key={p.id} className="card" style={{ padding:0, overflow:"hidden" }}>
                  {/* Header del proveedor */}
                  <div style={{ padding:"16px 20px", display:"flex", alignItems:"center", gap:14, cursor:"pointer" }}
                    onClick={()=>setProvExpandido(provExpandido===p.id ? null : p.id)}>
                    <div style={{
                      width:42, height:42, borderRadius:10, flexShrink:0,
                      background:"linear-gradient(135deg,#1e3a5f,#2d4a6a)",
                      display:"flex", alignItems:"center", justifyContent:"center",
                      fontSize:18, fontWeight:700, color:"#60a5fa"
                    }}>{p.nombre[0]}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:14, fontWeight:600 }}>{p.nombre}</div>
                      <div style={{ fontSize:12, color:"#6b7280", marginTop:2 }}>
                        {p.rubro && <span style={{ marginRight:10 }}>🏷 {p.rubro}</span>}
                        {p.contacto && <span>📞 {p.contacto}</span>}
                      </div>
                    </div>
                    <div style={{ textAlign:"right", marginRight:12 }}>
                      <div style={{ fontSize:11, color:"#6b7280" }}>Saldo adeudado</div>
                      <div style={{ fontSize:16, fontWeight:700, color: p.saldo>0?"#ef4444":"#22c55e" }}>
                        {p.saldo>0 ? formatARS(p.saldo) : "Sin deuda"}
                      </div>
                    </div>
                    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                      {(p.novedades?.length||0)>0 && (
                        <span className="badge" style={{ position:"static", width:"auto", borderRadius:20, padding:"0 8px", fontSize:10 }}>
                          {p.novedades.length} novedad{p.novedades.length!==1?"es":""}
                        </span>
                      )}
                      <span style={{ color:"#4b5563", fontSize:18 }}>{provExpandido===p.id?"▲":"▼"}</span>
                    </div>
                  </div>

                  {/* Panel expandido */}
                  {provExpandido===p.id && (
                    <div style={{ borderTop:"1px solid #1f2937", padding:"16px 20px", display:"flex", flexDirection:"column", gap:14 }}>
                      {/* Editar saldo */}
                      <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                        <span style={{ fontSize:12, color:"#6b7280" }}>Actualizar saldo:</span>
                        <input type="number" defaultValue={p.saldo}
                          onBlur={e=>actualizarSaldo(p.id,e.target.value)}
                          style={{ width:130, background:"#1f2937", border:"1px solid #374151", color:"#e2e8f0", padding:"5px 10px", borderRadius:7, fontSize:13 }}/>
                        <button onClick={()=>eliminarProveedor(p.id)} style={{
                          marginLeft:"auto", background:"#450a0a44", border:"1px solid #ef444433",
                          color:"#ef4444", padding:"5px 14px", borderRadius:7, cursor:"pointer", fontSize:12
                        }}>Eliminar proveedor</button>
                      </div>

                      {/* Agregar novedad */}
                      <div style={{ background:"#0d1117", borderRadius:10, padding:14 }}>
                        <div style={{ fontSize:12, fontWeight:600, marginBottom:10, color:"#9ca3af" }}>Nueva novedad</div>
                        <div style={{ display:"flex", gap:8 }}>
                          <select value={novedadForm.tipo}
                            onChange={e=>setNovedadForm(f=>({...f,tipo:e.target.value}))}
                            style={{ background:"#1f2937", border:"1px solid #374151", color:"#e2e8f0", padding:"6px 10px", borderRadius:7, fontSize:12, flexShrink:0 }}>
                            <option value="info">ℹ️ Info</option>
                            <option value="alerta">⚠️ Alerta</option>
                            <option value="sinstock">🚫 Sin stock</option>
                            <option value="cambio">🔄 Cambio</option>
                          </select>
                          <input type="text" placeholder="Ej: Se quedó sin talles S en remeras negras"
                            value={novedadForm.texto}
                            onChange={e=>setNovedadForm(f=>({...f,texto:e.target.value}))}
                            onKeyDown={e=>e.key==="Enter"&&agregarNovedad(p.id)}
                            style={{ flex:1, background:"#1f2937", border:"1px solid #374151", color:"#e2e8f0", padding:"6px 10px", borderRadius:7, fontSize:13 }}/>
                          <button onClick={()=>agregarNovedad(p.id)} style={{
                            background:"linear-gradient(135deg,#3b82f6,#8b5cf6)", border:"none",
                            color:"white", padding:"6px 14px", borderRadius:7, cursor:"pointer", fontSize:12, flexShrink:0
                          }}>Agregar</button>
                        </div>
                      </div>

                      {/* Historial de novedades */}
                      {(p.novedades||[]).length > 0 && (
                        <div>
                          <div style={{ fontSize:12, color:"#6b7280", marginBottom:8 }}>Historial</div>
                          {p.novedades.map((n,i)=>{
                            const tc = {info:{color:"#60a5fa",icon:"ℹ️"},alerta:{color:"#f59e0b",icon:"⚠️"},sinstock:{color:"#ef4444",icon:"🚫"},cambio:{color:"#a78bfa",icon:"🔄"}}[n.tipo]||{color:"#60a5fa",icon:"ℹ️"};
                            return (
                              <div key={n.id} style={{ display:"flex", gap:10, padding:"8px 0", borderBottom: i<p.novedades.length-1?"1px solid #1f293744":"none" }}>
                                <span>{tc.icon}</span>
                                <div style={{ flex:1 }}>
                                  <span style={{ fontSize:13, color:"#e2e8f0" }}>{n.texto}</span>
                                  <span style={{ fontSize:10, color:"#4b5563", marginLeft:8 }}>{n.fecha}</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
